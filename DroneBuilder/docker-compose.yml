services:
  db:
    image: postgres:16
    container_name: dronebuilder-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-DroneBuilderDb}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dronebuilder-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: dronebuilder-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dronebuilder-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dronebuilder-api
    restart: always
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-DroneBuilderDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      JwtOptions__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      JwtOptions__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      JwtOptions__Key: ${JWT_KEY:?JWT_KEY is required}
      AzureStorage__ConnectionString: ${AZURE_STORAGE_CONNECTION_STRING:?AZURE_STORAGE_CONNECTION_STRING is required}
      AzureStorage__ContainerName: ${AZURE_STORAGE_CONTAINER:?AZURE_STORAGE_CONTAINER is required}
      DatabaseInitialization__ApplyMigrations: "true"
      DatabaseInitialization__SeedIdentity: "true"
      IdentitySeed__Admin__Email: ${IDENTITY_ADMIN_EMAIL:?IDENTITY_ADMIN_EMAIL is required}
      IdentitySeed__Admin__Password: ${IDENTITY_ADMIN_PASSWORD:?IDENTITY_ADMIN_PASSWORD is required}
      IdentitySeed__User__Email: ${IDENTITY_USER_EMAIL:?IDENTITY_USER_EMAIL is required}
      IdentitySeed__User__Password: ${IDENTITY_USER_PASSWORD:?IDENTITY_USER_PASSWORD is required}
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - dronebuilder-net

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  dronebuilder-net:
