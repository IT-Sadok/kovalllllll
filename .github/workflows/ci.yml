name: CI - Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore ./DroneBuilder/DroneBuilder.sln

      - name: Build
        run: dotnet build ./DroneBuilder/DroneBuilder.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./DroneBuilder/DroneBuilder.sln --configuration Release --no-build --verbosity normal

        frontend:
          runs-on: ubuntu-latest

          defaults:
            run:
              working-directory: ./DroneBuilder.UI

          steps:
            - uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20.x'
                cache: npm
                cache-dependency-path: ./DroneBuilder.UI/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build